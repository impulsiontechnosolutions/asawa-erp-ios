# GitHub Actions: builds Asawa ERP iOS in the cloud.
#
# WHAT THIS DOES
# --------------
# Every push to main (and every PR) spins up a macOS runner, installs
# XcodeGen, generates the Xcode project from project.yml, then runs
# `xcodebuild` to produce an UNSIGNED .app bundle. You can download
# the bundle from the Actions tab → run → Artifacts.
#
# UNSIGNED .app cannot be installed on a real iPhone — Apple requires
# code signing. To produce a sideloadable .ipa you need an Apple
# Developer account ($99/yr) + a provisioning profile, then you uncomment
# the signing block at the bottom of this file.
#
# COST
# ----
# Public repos: free.
# Private repos: macOS minutes are billed at 10× the per-minute rate of
# Linux runners. A clean WebView-wrapper build takes ~3 minutes.

name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger from the Actions tab manually

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # macos-14 ships several Xcodes; pin one so builds are reproducible.
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate .app artifact
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "AsawaERP.app" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-Simulator-app
          path: ${{ steps.locate.outputs.app_path }}
          retention-days: 7

