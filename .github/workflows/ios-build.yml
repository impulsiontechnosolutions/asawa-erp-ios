# GitHub Actions: builds Asawa ERP iOS in the cloud.
#
# Two jobs:
#   - build      : runs on every push, produces unsigned simulator .app
#   - testflight : runs only on pushes to main, produces signed .ipa
#                  and uploads to TestFlight. Requires secrets below.
#
# Required repo secrets for the testflight job:
#   APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID,
#   APPLE_API_KEY_P8, IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD,
#   IOS_PROVISIONING_PROFILE

name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ----------------------------------------------------------------------
  # JOB 1 - Unsigned simulator build (free, runs on every push)
  # Output: AsawaERP.zip  -> drop into Appetize.io for browser preview
  # ----------------------------------------------------------------------
  build:
    name: Build (simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: |
          echo "Installed Xcodes on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Select the newest installed Xcode
        run: |
          # Pick the highest-numbered Xcode_*.app. Falls back to /Applications/Xcode.app.
          # This avoids hardcoding versions (the old hardcode of Xcode 15.4 broke
          # when XcodeGen started emitting format 77, only readable by Xcode 16.3+).
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_APP=/Applications/Xcode.app
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: |
          xcodegen generate
          # Print the objectVersion so we can see in logs which format was emitted.
          /usr/libexec/PlistBuddy -c "Print :objectVersion" AsawaERP.xcodeproj/project.pbxproj || true

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the .app bundle
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "AsawaERP.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find AsawaERP.app in DerivedData"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$RUNNER_TEMP/AsawaERP-Simulator.zip" "$(basename "$APP_PATH")"
          echo "zip_path=$RUNNER_TEMP/AsawaERP-Simulator.zip" >> "$GITHUB_OUTPUT"

      - name: Upload .app artifact (for Appetize.io etc.)
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-Simulator-app
          path: ${{ steps.locate.outputs.zip_path }}
          retention-days: 7

  # ----------------------------------------------------------------------
  # JOB 2 - Signed build -> TestFlight (requires secrets)
  # ----------------------------------------------------------------------
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-15
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_APP=/Applications/Xcode.app
          fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      # Skip if signing secrets aren't set yet (i.e. you haven't enrolled
      # in Apple Developer Program yet) -- avoids failing PRs from
      # outside contributors who don't have access to secrets.
      - name: Check for signing secrets
        id: secrets_check
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          if [ -z "$P12" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set yet — skipping TestFlight job. Add secrets when you enroll in Apple Developer Program."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up signing keychain
        if: steps.secrets_check.outputs.skip == 'false'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/asawa.keychain-db"
          KEYCHAIN_PASS="ci-temp-password"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" \
              -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
              -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

      - name: Install provisioning profile
        if: steps.secrets_check.outputs.skip == 'false'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > \
              ~/Library/MobileDevice/Provisioning\ Profiles/AsawaERP.mobileprovision

      - name: Install App Store Connect API key
        if: steps.secrets_check.outputs.skip == 'false'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" | base64 --decode > \
              ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Generate ExportOptions.plist
        if: steps.secrets_check.outputs.skip == 'false'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/AsawaERP.mobileprovision"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")
          echo "Detected profile name: $PROFILE_NAME"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.asawa.erp</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive
        if: steps.secrets_check.outputs.skip == 'false'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AsawaERP.xcarchive \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        if: steps.secrets_check.outputs.skip == 'false'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AsawaERP.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        if: steps.secrets_check.outputs.skip == 'false'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "build/ipa/AsawaERP.ipa" \
            -t ios \
            --apiKey "${API_KEY_ID}" \
            --apiIssuer "${API_ISSUER_ID}" \
            --verbose

      - name: Upload IPA artifact
        if: steps.secrets_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-ipa
          path: build/ipa/*.ipa
          retention-days: 30
