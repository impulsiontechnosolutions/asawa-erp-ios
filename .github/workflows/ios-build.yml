name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the .app bundle for Appetize
        id: locate
        run: |
          # Match any .app bundle under build/ — robust against renames
          APP_PATH=$(find build/Build/Products -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app bundle found"
            find build -type d -name "*.app" 2>/dev/null
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"

          cd "$(dirname "$APP_PATH")"
          # Quote handles spaces if any future PRODUCT_NAME has them
          zip -r "$RUNNER_TEMP/AsawaERP-Simulator.zip" "$(basename "$APP_PATH")"
          echo "zip_path=$RUNNER_TEMP/AsawaERP-Simulator.zip" >> "$GITHUB_OUTPUT"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-Simulator-app
          path: ${{ steps.locate.outputs.zip_path }}
          retention-days: 7
