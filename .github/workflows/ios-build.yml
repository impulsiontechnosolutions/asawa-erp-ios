# GitHub Actions: builds Asawa ERP iOS in the cloud.

name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the .app bundle for Appetize
        id: locate
        run: |
          # Look for AsawaERP.app under our explicit derived-data path
          APP_PATH=$(find build -type d -name "AsawaERP.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: AsawaERP.app not found in build/"
            echo "---- Listing all .app bundles found anywhere: ----"
            find . ~/Library/Developer/Xcode/DerivedData /Users/runner -type d -name "*.app" 2>/dev/null | head -20
            echo "---- Top-level build/ contents: ----"
            ls -la build/ 2>/dev/null || true
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"

          cd "$(dirname "$APP_PATH")"
          zip -r "$RUNNER_TEMP/AsawaERP-Simulator.zip" "$(basename "$APP_PATH")"
          echo "zip_path=$RUNNER_TEMP/AsawaERP-Simulator.zip" >> "$GITHUB_OUTPUT"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-Simulator-app
          path: ${{ steps.locate.outputs.zip_path }}
          retention-days: 7

