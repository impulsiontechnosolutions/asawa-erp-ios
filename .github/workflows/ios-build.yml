# GitHub Actions: builds Asawa ERP iOS in the cloud.
#
# WHAT THIS DOES
# --------------
# Every push to main (and every PR) spins up a macOS runner, installs
# XcodeGen, generates the Xcode project from project.yml, then runs
# xcodebuild to produce an UNSIGNED .app bundle. You can download
# the bundle from the Actions tab -> run -> Artifacts.
#
# UNSIGNED .app cannot be installed on a real iPhone - Apple requires
# code signing. To produce a sideloadable .ipa you need an Apple
# Developer account ($99/yr) + a provisioning profile, then you uncomment
# the signing block at the bottom of this file.

name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the .app bundle for Appetize
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "AsawaERP.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$RUNNER_TEMP/AsawaERP-Simulator.zip" "$(basename "$APP_PATH")"
          echo "zip_path=$RUNNER_TEMP/AsawaERP-Simulator.zip" >> "$GITHUB_OUTPUT"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-Simulator-app
          path: ${{ steps.locate.outputs.zip_path }}
          retention-days: 7

  # =====================================================================
  # Signed build for TestFlight - UNCOMMENT once you have:
  #   1. Apple Developer Program enrollment ($99/yr)
  #   2. Distribution certificate + provisioning profile
  #   3. Repo secrets configured (see generate-ios-signing-from-ubuntu.sh)
