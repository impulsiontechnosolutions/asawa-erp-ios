# GitHub Actions: builds Asawa ERP iOS in the cloud.
#
# Two jobs:
#   - build      : runs on every push, produces unsigned simulator .app
#                  (free for public repos, works on free GitHub accounts)
#   - testflight : runs only on pushes to main, produces signed .ipa and
#                  uploads to TestFlight. Requires the secrets listed below.
#
# Required repo secrets for the testflight job (Settings -> Secrets -> Actions):
#   APPLE_TEAM_ID            - 10-char team ID
#   APPLE_API_KEY_ID         - App Store Connect API Key ID
#   APPLE_API_ISSUER_ID      - App Store Connect API Issuer ID
#   APPLE_API_KEY_P8         - base64-encoded contents of AuthKey_XXX.p8
#   IOS_DIST_CERT_P12        - base64-encoded distribution .p12 file
#   IOS_DIST_CERT_PASSWORD   - password for the .p12
#   IOS_PROVISIONING_PROFILE - base64-encoded .mobileprovision

name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ----------------------------------------------------------------------
  # JOB 1 - Unsigned simulator build (free, runs on every push)
  # Output: AsawaERP.app   -> drop into Appetize.io for browser preview
  # ----------------------------------------------------------------------
  build:
    name: Build (simulator, unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the .app bundle
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "AsawaERP.app" | head -n 1)
          cd "$(dirname "$APP_PATH")"
          zip -r "$RUNNER_TEMP/AsawaERP-Simulator.zip" "$(basename "$APP_PATH")"
          echo "zip_path=$RUNNER_TEMP/AsawaERP-Simulator.zip" >> "$GITHUB_OUTPUT"

      - name: Upload .app artifact (for Appetize.io etc.)
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-Simulator-app
          path: ${{ steps.locate.outputs.zip_path }}
          retention-days: 7

  # ----------------------------------------------------------------------
  # JOB 2 - Signed build -> TestFlight (requires secrets)
  # Output: a build appears in your iPhone's TestFlight app within ~15 min.
  # ----------------------------------------------------------------------
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-14
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AsawaERP.xcodeproj
        run: xcodegen generate

      # ---- Import the distribution certificate into a temp keychain ----
      - name: Set up signing keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/asawa.keychain-db"
          KEYCHAIN_PASS="ci-temp-password"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" \
              -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
              -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

      # ---- Install the provisioning profile ----
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > \
              ~/Library/MobileDevice/Provisioning\ Profiles/AsawaERP.mobileprovision

      # ---- Drop the App Store Connect API key in the well-known place ----
      - name: Install App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" | base64 --decode > \
              ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      # ---- Write ExportOptions.plist on the fly ----
      - name: Generate ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Read the actual UUID & name out of the installed mobileprovision
          # so we don't depend on the user naming their profile a specific
          # string in the Apple Developer portal.
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/AsawaERP.mobileprovision"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")
          echo "Detected profile name: $PROFILE_NAME"

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.asawa.erp</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          # Save the name for the archive step
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # ---- Archive ----
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project AsawaERP.xcodeproj \
            -scheme AsawaERP \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AsawaERP.xcarchive \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      # ---- Export the .ipa ----
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AsawaERP.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      # ---- Upload to TestFlight ----
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "build/ipa/AsawaERP.ipa" \
            -t ios \
            --apiKey "${API_KEY_ID}" \
            --apiIssuer "${API_ISSUER_ID}" \
            --verbose

      - name: Upload IPA artifact (for download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: AsawaERP-ipa
          path: build/ipa/*.ipa
          retention-days: 30
